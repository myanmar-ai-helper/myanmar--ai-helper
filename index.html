<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myanmar AI Helper</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #222;
}

header {
  background: linear-gradient(135deg, #1769e0, #4b8df8);
  color: white;
  text-align: center;
  padding: 35px 20px;
}

.logo {
  font-size: 42px;
}

header h1 {
  margin: 10px 0;
  font-size: 32px;
}

header p {
  margin: 0;
  font-size: 16px;
}

.container {
  max-width: 850px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

textarea {
  width: 100%;
  min-height: 150px;
  padding: 16px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #1769e0;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #0d55bd;
}

.result {
  margin-top: 20px;
  padding: 18px;
  background: #f5f7fb;
  border-radius: 12px;
  min-height: 70px;
  line-height: 1.7;
}

.tools {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 25px;
}

.tool {
  background: white;
  border: 1px solid #ddd;
  padding: 18px;
  border-radius: 14px;
  cursor: pointer;
  text-align: center;
}

.tool:hover {
  background: #eef5ff;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}

@media(max-width:600px) {
  .tools {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🤖</div>
  <h1>Myanmar AI Helper</h1>
  <p>မြန်မာလူမျိုးတွေအတွက် အသုံးဝင်တဲ့ AI Tools</p>
</header>

<div class="container">

  <div class="card">
    <h2>✨ AI Helper</h2>

    <textarea id="message"
      placeholder="ဥပမာ - Facebook post တစ်ခုရေးပေးပါ"></textarea>

    <button onclick="askAI()">
      ✨ AI ကိုမေးမယ်
    </button>

    <div class="result" id="result">
      ဒီနေရာမှာ AI အဖြေပြပါမယ်။
    </div>
  </div>

  <div class="tools">

    <div class="tool"
      onclick="setText('Facebook post တစ်ခုရေးပေးပါ')">
      📱<br>
      <b>Facebook Post</b>
    </div>

    <div class="tool"
      onclick="setText('အလုပ်လျှောက်လွှာတစ်စောင်ရေးပေးပါ')">
      💼<br>
      <b>Job Application</b>
    </div>

    <div class="tool"
      onclick="setText('ဒီစာကို English ဘာသာပြန်ပေးပါ')">
      🌐<br>
      <b>ဘာသာပြန်</b>
    </div>

    <div class="tool"
      onclick="setText('CV တစ်စောင်ရေးဖို့ ကူညီပေးပါ')">
      📄<br>
      <b>CV Helper</b>
    </div>

  </div>

</div>

<footer>
  Myanmar AI Helper © 2026
</footer>

<script>

function setText(text) {
  document.getElementById("message").value = text;
  document.getElementById("message").focus();
}

function askAI() {

  const message =
    document.getElementById("message").value.trim();

  const result =
    document.getElementById("result");

  if (!message) {
    result.innerHTML =
      "⚠️ အရင်ဆုံး မေးချင်တာကို ရိုက်ထည့်ပေးပါ။";
    return;
  }

  result.innerHTML =
    "⏳ AI ကို ချိတ်ဆက်နေပါတယ်...<br><br>" +
    "💡 လက်ရှိ Version မှာ AI API မချိတ်ရသေးပါဘူး။ " +
    "နောက်အဆင့်မှာ AI API ချိတ်ပြီး တကယ်အဖြေထုတ်ပေးနိုင်အောင်လုပ်ပါမယ်။";
}

</script>

</body>
</html>
