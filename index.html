<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myanmar AI Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #0066ff, #00a8ff);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    .logo {
      font-size: 50px;
    }

    header h1 {
      margin: 10px 0;
      font-size: 32px;
    }

    header p {
      margin: 0;
      font-size: 17px;
    }

    .container {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 16px;
      border: 2px solid #e1e6ef;
      border-radius: 12px;
      resize: vertical;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #008cff;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      cursor: pointer;
      background: #087cff;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .clear {
      background: #777;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #f1f7ff;
      border-radius: 12px;
      min-height: 80px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .tool {
      background: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      cursor: pointer;
    }

    .tool:hover {
      transform: translateY(-2px);
    }

    .tool-icon {
      font-size: 30px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 600px) {
      .buttons,
      .tools {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🤖</div>
    <h1>Myanmar AI Helper</h1>
    <p>မြန်မာလူမျိုးတွေအတွက် အသုံးဝင်တဲ့ AI Tools</p>
  </header>

  <div class="container">

    <div class="card">

      <div class="title">✨ AI Helper</div>

      <textarea id="input"
        placeholder="ဥပမာ - Facebook post တစ်ခုရေးပေးပါ"></textarea>

      <div class="buttons">
        <button onclick="generate()">✨ AI ဖြင့်လုပ်မယ်</button>
        <button onclick="example()">💡 Example</button>
        <button class="clear" onclick="clearText()">🗑️ ရှင်းမယ်</button>
      </div>

      <div class="result" id="result">
        ဒီနေရာမှာ AI ရလဒ်ပေါ်လာပါမယ်။
      </div>

    </div>

    <div class="tools">

      <div class="tool" onclick="setTool('Facebook Post ရေးပေးပါ')">
        <div class="tool-icon">📱</div>
        <b>Facebook Post</b>
        <p>Post ရေးပေးမယ်</p>
      </div>

      <div class="tool" onclick="setTool('ကြော်ငြာစာရေးပေးပါ')">
        <div class="tool-icon">📢</div>
        <b>ကြော်ငြာစာ</b>
        <p>Marketing စာရေးပေးမယ်</p>
      </div>

      <div class="tool" onclick="setTool('စာကို မြန်မာလို ပြန်ရေးပေးပါ')">
        <div class="tool-icon">✍️</div>
        <b>စာရေးကူ</b>
        <p>စာရေးရာမှာ ကူညီပေးမယ်</p>
      </div>

    </div>

  </div>

  <footer>
    © 2026 Myanmar AI Helper
  </footer>

  <script>

    function generate() {
      const input = document.getElementById("input").value.trim();
      const result = document.getElementById("result");

      if (!input) {
        result.innerText = "⚠️ အရင်ဆုံး မေးချင်တာကို ရေးပါ။";
        return;
      }

      result.innerText =
        "🤖 Demo AI Response\n\n" +
        "သင်ရေးထားတာ - " + input +
        "\n\n" +
        "ဒီနေရာက Demo ဖြစ်ပါတယ်။ " +
        "နောက်အဆင့်မှာ တကယ့် AI API နဲ့ ချိတ်ပြီး " +
        "မေးသမျှကို တကယ်ဖြေနိုင်အောင် ပြုလုပ်မယ်။";
    }

    function example() {
      document.getElementById("input").value =
        "Online shop အတွက် Facebook post တစ်ခု ရေးပေးပါ";
    }

    function clearText() {
      document.getElementById("input").value = "";
      document.getElementById("result").innerText =
        "ဒီနေရာမှာ AI ရလဒ်ပေါ်လာပါမယ်။";
    }

    function setTool(text) {
      document.getElementById("input").value = text;
      document.getElementById("input").focus();
    }

  </script>

</body>
</html>
