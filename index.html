<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Myanmar AI Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      color: #222;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid #d8dce5;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      outline: none;
    }

    textarea:focus {
      border-color: #1689e8;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #sendBtn {
      background: #1689e8;
      color: white;
      flex: 1;
    }

    #exampleBtn {
      background: #1689e8;
      color: white;
    }

    #clearBtn {
      background: #333;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .response {
      margin-top: 22px;
      background: #f7f9fc;
      border-radius: 15px;
      padding: 20px;
      min-height: 100px;
    }

    .response h2 {
      margin-top: 0;
      font-size: 20px;
    }

    #answer {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 16px;
    }

    .loading {
      color: #777;
    }

    .error {
      color: #c62828;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .app {
        padding: 18px;
      }

      h1 {
        font-size: 23px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>✨ AI Helper</h1>

    <textarea
      id="message"
      placeholder="မေးချင်တာကို ဒီမှာရေးပါ..."
    ></textarea>

    <div class="buttons">

      <button id="sendBtn">
        ✨ AI ဖြေမယ်
      </button>

      <button id="exampleBtn">
        💡 Example
      </button>

      <button id="clearBtn">
        🗑️ ရှင်းမယ်
      </button>

    </div>

    <div class="response">

      <h2>🤖 AI Response</h2>

      <div id="answer">
        AI ကို မေးလိုက်ပါ။
      </div>

    </div>

  </div>

  <script>
    const messageInput =
      document.getElementById("message");

    const sendBtn =
      document.getElementById("sendBtn");

    const exampleBtn =
      document.getElementById("exampleBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const answer =
      document.getElementById("answer");


    async function sendMessage() {

      const message =
        messageInput.value.trim();

      if (!message) {
        answer.textContent =
          "မေးချင်တာကို အရင်ရေးပါ။";
        return;
      }

      sendBtn.disabled = true;

      answer.className = "loading";
      answer.textContent =
        "AI စဉ်းစားနေပါတယ်...";


      try {

        const response = await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })
          }
        );


        const data =
          await response.json();


        if (!response.ok) {
          throw new Error(
            data.error ||
            "AI request failed"
          );
        }


        answer.className = "";
        answer.textContent =
          data.reply || "အဖြေမရပါ။";


      } catch (error) {

        console.error(error);

        answer.className = "error";

        answer.textContent =
          "Error: " + error.message;

      } finally {

        sendBtn.disabled = false;

      }
    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }

      }
    );


    exampleBtn.addEventListener(
      "click",
      function() {

        messageInput.value =
          "မြန်မာနိုင်ငံအကြောင်း စိတ်ဝင်စားစရာ အချက် ၅ ချက် ပြောပြပါ။";

        messageInput.focus();

      }
    );


    clearBtn.addEventListener(
      "click",
      function() {

        messageInput.value = "";

        answer.className = "";

        answer.textContent =
          "AI ကို မေးလိုက်ပါ။";

        messageInput.focus();

      }
    );
  </script>

</body>
</html>
